    description: Monotonic sequence number per aggregate.
quality:
  type: SodaChecks
  specification:
    checks for events:
    - missing_count(aggregate_id) = 0
    - missing_count(aggregate_type) = 0
    - missing_count(event_id) = 0
    - duplicate_count(event_id) = 0
    - missing_count(event_type) = 0
    - missing_count(metadata) = 0
    - missing_count(occurred_at) = 0
    - missing_count(payload) = 0
    - min(payload.confidence) >= 0.0
    - max(payload.confidence) <= 1.0
    - min(payload.confidence_score) >= 0.0
    - max(payload.confidence_score) <= 1.0
    - min(payload.decision.confidence) >= 0.0
    - max(payload.decision.confidence) <= 1.0
    - min(payload.facts.field_confidence) >= 0.0
    - max(payload.facts.field_confidence) <= 1.0
    - min(payload.overall_confidence) >= 0.0
    - max(payload.overall_confidence) <= 1.0
    - missing_count(recorded_at) = 0
    - missing_count(schema_version) = 0
    - missing_count(sequence_number) = 0
    - row_count >= 1
    - recorded_at >= occurred_at
    - sequence_number is_monotonic_per aggregate_id
llm_annotations:
- status: pending
  fields:
  - payload
  - payload.decision
  - payload.decision.key_concerns
  - payload.document_ids_consumed
  - payload.events_written
  - payload.events_written[*]
  - payload.facts
  - payload.facts.field_confidence
  - payload.input_keys
  - payload.output_keys
  note: Business-meaning enrichment can be added for ambiguous columns using a model-assisted
    pass. This generator keeps baseline contracts deterministic and offline-safe.
