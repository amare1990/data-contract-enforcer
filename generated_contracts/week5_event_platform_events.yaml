quality:
  type: SodaChecks
  specification:
    checks for events:
    - missing_count(event_id) = 0
    - missing_count(event_type) = 0
    - missing_count(aggregate_id) = 0
    - missing_count(aggregate_type) = 0
    - missing_count(sequence_number) = 0
    - missing_count(schema_version) = 0
    - missing_count(occurred_at) = 0
    - missing_count(recorded_at) = 0
    - min(payload.overall_confidence) >= 0.0
    - max(payload.overall_confidence) <= 1.0
    - min(payload.confidence) >= 0.0
    - max(payload.confidence) <= 1.0
    - min(payload.confidence_score) >= 0.0
    - max(payload.confidence_score) <= 1.0
    - row_count >= 1
