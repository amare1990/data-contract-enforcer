version: 2
models:
- name: events
  description: One record per domain event in the event store, including payload,
    event metadata, schema version, and event timing.
  columns:
  - name: aggregate_id
    description: Identifier field; observed values are not UUID-formatted.
    tests:
    - not_null
    - relationships:
        to: ref('event_streams')
        field: stream_id
  - name: aggregate_type
    description: PascalCase identifier.
    tests:
    - not_null
    - expect_column_values_to_match_regex:
        regex: ^[A-Z][A-Za-z0-9]*$
  - name: event_id
    description: Identifier field; UUID format verified from observed values.
    tests:
    - not_null
    - unique
    - expect_uuid_format: {}
  - name: event_type
    description: PascalCase identifier.
    tests:
    - not_null
    - expect_column_values_to_match_regex:
        regex: ^[A-Z][A-Za-z0-9]*$
