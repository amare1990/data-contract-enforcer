# Minimum viable contract registry for the Data Contract Enforcer.
# Consumers register the exact contract + fields they depend on.
subscriptions:
  - contract_id: week3-document-refinery-extractions
    subscriber_id: week4-cartographer
    subscriber_team: week4
    fields_consumed: [doc_id, extracted_facts, extraction_model]
    breaking_fields:
      - field: extracted_facts.confidence
        reason: used for node ranking; scale change breaks ranking logic
      - field: doc_id
        reason: primary key for node identity in lineage graph
    validation_mode: ENFORCE
    registered_at: '2025-01-10T09:00:00Z'
    contact: week4-team@org.com

  - contract_id: week4-brownfield-cartographer-lineage
    subscriber_id: week7-enforcer
    subscriber_team: week7
    fields_consumed: [snapshot_id, git_commit, nodes, edges]
    breaking_fields:
      - field: edges.source
        reason: lineage traversal requires resolvable edge endpoints
      - field: edges.target
        reason: lineage traversal requires resolvable edge endpoints
      - field: git_commit
        reason: git attribution depends on stable commit identifiers
    validation_mode: ENFORCE
    registered_at: '2025-01-10T09:05:00Z'
    contact: week7-team@org.com

  - contract_id: week5-event-platform-events
    subscriber_id: week7-enforcer
    subscriber_team: week7
    fields_consumed: [event_id, event_type, aggregate_id, payload, schema_version]
    breaking_fields:
      - field: event_type
        reason: payload schema lookup is keyed by registered event type
      - field: payload
        reason: event payload must validate against the event schema
      - field: schema_version
        reason: compatibility checks and migrations are version-aware
    validation_mode: ENFORCE
    registered_at: '2025-01-10T09:10:00Z'
    contact: week7-team@org.com

  - contract_id: langsmith-trace-records
    subscriber_id: week7-ai-extension
    subscriber_team: week7
    fields_consumed: [id, run_type, inputs, outputs, total_tokens]
    breaking_fields:
      - field: run_type
        reason: trace schema validation depends on the allowed enum set
      - field: total_tokens
        reason: token accounting check requires prompt and completion token totals
    validation_mode: AUDIT
    registered_at: '2025-01-10T09:15:00Z'
    contact: week7-team@org.com

  - contract_id: week2-digital-courtroom-verdicts
    subscriber_id: week7-ai-extension
    subscriber_team: week7
    fields_consumed: [verdict_id, overall_verdict, overall_score, confidence]
    breaking_fields:
      - field: overall_verdict
        reason: output schema violation rate tracks the contract enum values
      - field: confidence
        reason: downstream AI reliability checks assume 0.0-1.0 confidence scale
    validation_mode: AUDIT
    registered_at: '2025-01-10T09:20:00Z'
    contact: week7-team@org.com
