kind: DataContract
apiVersion: v3.0.0
id: week3-document-refinery-extractions
info:
  title: Week 3 Document Refinery - Extraction Records
  version: 1.0.0
  owner: week8-team
  description: One record per processed document. Each record contains extracted facts,
    entity references, processing metadata, and lineage-relevant identifiers.
servers:
  local:
    type: local
    path: outputs/week3/extractions.jsonl
    format: jsonl
terms:
  usage: Internal inter-system data contract.
  limitations: Auto-generated from observed data; review semantic clauses before production
    use.
schema:
  confidence:
    type: number
    required: true
    minimum: 0.0
    maximum: 1.0
    description: Confidence score. Must remain 0.0-1.0 float. Breaking change if converted
      to 0-100 scale.
  content_hash:
    type: string
    required: true
  doc_id:
    type: string
    required: true
    enum:
    - CBE ANNUAL REPORT 2023-24
    description: Identifier field; observed values are not UUID-formatted. Low-cardinality
      categorical field inferred from observed data.
  ldu_id:
    type: string
    required: true
    format: uuid
    description: Identifier field; UUID format verified from observed values.
  page_number:
    type: integer
    required: true
  source_path:
    type: string
    required: true
    enum:
    - data/CBE ANNUAL REPORT 2023-24.pdf
    description: Low-cardinality categorical field inferred from observed data.
  text:
    type: string
    required: true
quality:
  type: SodaChecks
  specification:
    checks for extractions:
    - missing_count(confidence) = 0
    - min(confidence) >= 0.0
    - max(confidence) <= 1.0
    - missing_count(content_hash) = 0
    - missing_count(doc_id) = 0
    - duplicate_count(doc_id) = 0
    - missing_count(ldu_id) = 0
    - missing_count(page_number) = 0
    - missing_count(source_path) = 0
    - missing_count(text) = 0
    - row_count >= 1
lineage:
  upstream: []
  downstream:
  - id: week4-cartographer
    subscriber_team: week4
    description: Registry subscriber for week3-document-refinery-extractions.
    fields_consumed:
    - doc_id
    - extracted_facts
    - extraction_model
    breaking_if_changed:
    - extracted_facts.confidence
    - doc_id
    validation_mode: ENFORCE
    contact: week4-team@org.com
  - id: py::../../week3/document-intelligence-refinery/src/adapters/fact_table_store.py::call::20
    description: Observed downstream consumer of extractions from lineage snapshot.
    fields_consumed:
    - doc_id
    - extracted_facts
    - entities
    - extraction_model
    breaking_if_changed: &id001
    - confidence
    - content_hash
    - doc_id
    - ldu_id
    - page_number
    - source_path
    - text
  - id: py::../../week3/document-intelligence-refinery/src/adapters/fact_table_store.py::call::40
    description: Observed downstream consumer of extractions from lineage snapshot.
    fields_consumed:
    - doc_id
    - extracted_facts
    - entities
    - extraction_model
    breaking_if_changed: *id001
  - id: py::../../week3/document-intelligence-refinery/src/adapters/fact_table_store.py::call::69
    description: Observed downstream consumer of extractions from lineage snapshot.
    fields_consumed:
    - doc_id
    - extracted_facts
    - entities
    - extraction_model
    breaking_if_changed: *id001
  - id: py::../../week3/document-intelligence-refinery/src/adapters/fact_table_store.py::call::82
    description: Observed downstream consumer of extractions from lineage snapshot.
    fields_consumed:
    - doc_id
    - extracted_facts
    - entities
    - extraction_model
