kind: DataContract
apiVersion: v3.0.0
id: week3-document-refinery-extractions
info:
  title: Week 3 Document Refinery - Extraction Records
  version: 1.0.0
  owner: week8-team
  description: One record per processed document. Each record contains extracted facts,
    entity references, processing metadata, and lineage-relevant identifiers.
servers:
  local:
    type: local
    path: outputs/week3/extractions.jsonl
    format: jsonl
terms:
  usage: Internal inter-system data contract.
  limitations: Auto-generated from observed data; review semantic clauses before production
    use.
schema:
  confidence:
    type: number
    required: true
    minimum: 0.0
    maximum: 1.0
    description: Confidence score. Must remain 0.0-1.0 float. Breaking change if converted
      to 0-100 scale.
  content_hash:
    type: string
    required: true
  doc_id:
    type: string
    required: true
    description: Identifier field; observed values are not UUID-formatted.
  ldu_id:
    type: string
    required: true
    format: uuid
    description: Identifier field; UUID format verified from observed values.
  page_number:
    type: integer
    required: true
  source_path:
    type: string
    required: true
  text:
    type: string
    required: true
quality:
  type: SodaChecks
  specification:
    checks for extractions:
    - missing_count(doc_id) = 0
    - missing_count(source_path) = 0
    - missing_count(ldu_id) = 0
    - missing_count(page_number) = 0
    - missing_count(text) = 0
    - missing_count(confidence) = 0
    - missing_count(content_hash) = 0
    - duplicate_count(doc_id) = 0
    - min(confidence) >= 0.0
    - max(confidence) <= 1.0
    - row_count >= 1
llm_annotations:
- status: pending
  fields:
  - text
  - content_hash
  note: Business-meaning enrichment can be added for ambiguous columns using a model-assisted
    pass. This generator keeps baseline contracts deterministic and offline-safe.
lineage:
  upstream: []
  downstream: []
